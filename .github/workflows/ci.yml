name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # caches the wrapper distribution and build cache between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP installs missing components itself, but a pinned platform keeps the
      # build reproducible: compileSdk 37 is a minor-versioned platform
      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      # Plain JVM unit tests (the reader progress-gate math); no emulator needed
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Guards backward compatibility: these decode real payloads captured from
      # an older Komga to keep missing fields tolerated
      - name: Run API decoding tests
        run: ./gradlew :core:api:test --console=plain

      # The lint gate: app/lint-baseline.xml freezes the findings that predate it, so this
      # fails on NEW issues only. Fix the issue or deliberately regenerate the baseline.
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Runs the same R8 configuration the release workflow uses; without signing
      # secrets this only produces an unsigned APK, but it keeps the shrinker
      # configuration honest on every push and pull request.
      - name: Build release APK (R8, unsigned)
        run: ./gradlew :app:assembleRelease --console=plain
