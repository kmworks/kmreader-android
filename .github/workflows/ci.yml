name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # no wrapper is committed, so pin the same Gradle the project is built with
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP installs missing components itself, but a pinned platform keeps the
      # build reproducible: compileSdk 37 is a minor-versioned platform
      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain
