name: Release

# Publishes a GitHub release whenever the app version in app/build.gradle.kts is
# bumped on main: the version job computes v<versionName>, skips if that release
# already exists, otherwise the release job builds the APK and creates the
# release. `gh release create` also creates the tag.
#
# When the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
# repository secrets are present the APK is a minified, release-signed build;
# without them the workflow still publishes a debug-signed APK so the release
# channel keeps working before the keystore is wired up.
on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      version_code: ${{ steps.v.outputs.version_code }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' "$FILE" | head -n1)
          CODE=$(sed -n 's/^ *versionCode = \(.*\)$/\1/p' "$FILE" | head -n1)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::could not read versionName/versionCode from $FILE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release v$VERSION already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::releasing v$VERSION (versionCode $CODE)"
          fi

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      # Secrets are not available in `if:` expressions, so the check happens in
      # the shell and the outcome is forwarded through GITHUB_ENV.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::KEYSTORE_BASE64 is not configured; publishing a debug-signed APK"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "::notice::building a release-signed APK"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:assembleRelease --console=plain
          else
            ./gradlew :app:assembleDebug --console=plain
          fi

      - name: Name and checksum the APK
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            SRC=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)
            OUT="kmreader-android-$VERSION.apk"
          else
            SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
            OUT="kmreader-android-$VERSION-debug.apk"
          fi
          [ -n "$SRC" ] || { echo "::error::no APK produced"; exit 1; }
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          if [ "$SIGNED" = "true" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
            "$APKSIGNER" verify --print-certs "$OUT"
          fi
          echo "ASSET=$OUT" >> "$GITHUB_ENV"
          echo "ASSET_SUM=$OUT.sha256" >> "$GITHUB_ENV"
          ls -l "$OUT" "$OUT.sha256"

      - name: Write release notes
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            SIGNING_LINE="- Release-signed APK (minified with R8, no debug flag)"
            UPGRADE_LINE="- Upgrading from v0.1.0 requires uninstalling it first: that build was debug-signed"
          else
            SIGNING_LINE="- Debug-signed APK for install testing — not a store artifact yet"
            UPGRADE_LINE="- Debug-signed by this runner, so it cannot upgrade the previous release in place"
          fi
          cat > notes.md <<EOF
          KMReader for Android $VERSION.

          - versionName \`$VERSION\`, versionCode \`$VERSION_CODE\`
          - Package \`com.kmworks.kmreader\`, Android 8.0 (API 28) and newer
          - Komga 1.20.0+; trackers, smart-list editing, client settings sync and
            reading stats additionally need a kmrs server
          $SIGNING_LINE
          $UPGRADE_LINE

          Install with \`adb install $ASSET\`, or sideload it on the device. Verify
          the download with \`sha256sum -c $ASSET.sha256\`.
          EOF
          cat notes.md

      - name: Create release
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$ASSET" \
            "$ASSET_SUM"
